<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5f4a">
<title>Cardtrader Cart Filler</title>
<style>
  :root {
    --bg:#f5f4f0; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3e1d9;
    --accent:#1f5f4a; --accent-ink:#ffffff; --warn:#a15c00; --bad:#b3261e; --ok:#1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --card:#1f201e; --ink:#ecebe6; --muted:#9b9a93; --line:#33342f;
      --accent:#4fb08c; --accent-ink:#0d1f18; --warn:#e0a24a; --bad:#f2837b; --ok:#6cd09c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:900px; margin:0 auto; padding:20px 14px 80px; }
  h1 { font-size:21px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  h2 { font-size:15px; margin:0 0 10px; display:flex; gap:8px; align-items:center; }
  h2 .n { background:var(--accent); color:var(--accent-ink); width:22px; height:22px; border-radius:50%;
    display:inline-grid; place-items:center; font-size:12px; flex:none; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=number], input[type=url], select {
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); font:inherit; font-size:16px; }
  input[type=file] { font:inherit; max-width:100%; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
  .check { display:flex; gap:8px; align-items:center; font-size:14px; margin:8px 0; }
  .check input { width:auto; } .check label { margin:0; color:inherit; font-size:14px; }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--accent);
    background:var(--accent); color:var(--accent-ink); cursor:pointer; font-weight:600; }
  button.secondary { background:transparent; color:var(--accent); }
