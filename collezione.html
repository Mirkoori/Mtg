<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5f4a">
<title>Collezione Magic</title>
<style>
  :root {
    --bg:#f5f4f0; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#e3e1d9;
    --accent:#1f5f4a; --accent-ink:#ffffff; --warn:#a15c00; --bad:#b3261e; --ok:#1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --card:#1f201e; --ink:#ecebe6; --muted:#9b9a93; --line:#33342f;
      --accent:#4fb08c; --accent-ink:#0d1f18; --warn:#e0a24a; --bad:#f2837b; --ok:#6cd09c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body.noscroll { overflow:hidden; }
  main { max-width:1000px; margin:0 auto; padding:14px 12px 90px; }
  nav { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  nav a { padding:7px 14px; border-radius:999px; border:1px solid var(--line); text-decoration:none; color:var(--ink); background:var(--card); font-weight:600; font-size:14px; }
  nav a.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  h1 { font-size:21px; margin:0 0 10px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
  select, input[type=text], input[type=file] { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; font-size:16px; }
  input[type=file] { font-size:14px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer; font-weight:600; }
  button.secondary { background:transparent; color:var(--accent); }
  button.link { background:none; border:none; padding:0; color:var(--accent); text-decoration:underline; font-weight:500; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .row > select { flex:1 1 44%; width:auto; min-width:0; }
  .msg { font-size:13px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:14px; display:flex; gap:5px; align-items:center; background:var(--bg); cursor:pointer; user-select:none; }
  .chip input { width:auto; margin:0; }
  .chip.on { border-color:var(--accent); background:var(--accent); color:var(--accent-ink); }
  .seg { display:inline-flex; border:1px solid var(--accent); border-radius:8px; overflow:hidden; }
  .seg button { border-radius:0; background:transparent; color:var(--accent); padding:6px 12px; border:none; }
  .seg button.on { background:var(--accent); color:var(--accent-ink); }
  progress { width:100%; height:10px; margin-top:8px; }
  .stats { display:flex; gap:20px; flex-wrap:wrap; }
  .stats b { font-size:22px; display:block; line-height:1.2; } .stats span { color:var(--muted); font-size:12px; }
  .ghead { display:flex; align-items:baseline; gap:10px; margin:16px 2px 6px; font-weight:700; font-size:16px; }
  .ghead small { color:var(--muted); font-weight:400; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:10px; }
  .tile { position:relative; cursor:pointer; min-width:0; }
  .tile img { width:100%; border-radius:6px; display:block; aspect-ratio:488/680; background:var(--line); }
  .noimg { aspect-ratio:488/680; border:1px solid var(--line); border-radius:6px; padding:6px; font-size:12px; display:grid; place-items:center; text-align:center; }
  .qb { position:absolute; right:4px; bottom:30px; background:rgba(0,0,0,.78); color:#fff; font-size:12px; font-weight:700; border-radius:10px; padding:0 7px; }
  .fb { position:absolute; left:4px; top:4px; background:rgba(255,255,255,.88); color:#6b3fa0; font-size:11px; font-weight:700; border-radius:8px; padding:0 6px; }
  .cap { font-size:11.5px; line-height:1.25; margin-top:3px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .cap small { color:var(--muted); }
  .lrow { display:flex; align-items:center; gap:8px; padding:6px 2px; border-top:1px solid var(--line); cursor:pointer; }
  .lrow .q { width:30px; text-align:right; font-weight:700; } .lrow .n { flex:1; min-width:0; } .lrow .m { white-space:nowrap; } .lrow .s { color:var(--muted); font-size:12px; width:46px; } .lrow .p { width:56px; text-align:right; color:var(--muted); font-size:13px; }
  .pip { display:inline-grid; place-items:center; min-width:17px; height:17px; border-radius:50%; font-size:10px; font-weight:700; margin:0 1px; padding:0 3px; color:#222; vertical-align:middle; }
  .pW { background:#f6f1d0; } .pU { background:#a9d4ee; } .pB { background:#b9afa8; } .pR { background:#f4a58a; } .pG { background:#9bd3ae; } .pC, .pN, .pX { background:#d6d3cc; }
  .sep { margin:0 4px; color:var(--muted); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; overflow:auto; padding:14px; }
  #mBox { background:var(--card); border-radius:14px; max-width:760px; margin:0 auto; padding:14px; position:relative; }
  #mClose { position:absolute; top:6px; right:8px; background:transparent; color:var(--muted); border:none; font-size:24px; padding:2px 8px; }
  #mBody { display:flex; gap:14px; flex-wrap:wrap; }
  .mimg { flex:0 0 240px; max-width:100%; } .mimg img { width:100%; border-radius:10px; margin-bottom:6px; }
  .minfo { flex:1 1 260px; min-width:0; } .minfo h3 { margin:0; font-size:19px; }
  .en { color:var(--muted); font-size:12.5px; } .mm { margin:4px 0; }
  .otext { background:var(--bg); border-radius:8px; padding:8px 10px; margin:8px 0; font-size:14px; }
  .meta { font-size:13px; color:var(--muted); margin-top:3px; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#222; color:#fff; padding:9px 16px; border-radius:20px; font-size:14px; z-index:30; max-width:90%; text-align:center; }
  #empty { text-align:center; color:var(--muted); padding:26px 10px; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; }
</style>
<link rel="stylesheet" href="theme.css?v=1">
</head>
<body>
<main>
  <nav><a href="index.html">Carrello</a><a href="mazzi.html">Mazzi</a><a href="collezione.html" class="on">Collezione</a><a href="prova.html">Prova</a></nav>
  <h1>La mia collezione</h1>

  <section class="panel">
    <label for="csv" class="msg">File CSV della collezione (ManaBox, Dragon Shield e simili)</label>
    <input id="csv" type="file" accept=".csv,text/csv,text/plain">
    <progress id="prog" value="0" max="1" hidden></progress>
    <div class="msg" id="loadMsg" style="margin-top:6px"></div>
    <div class="row" id="loadTools" hidden>
      <button class="secondary" id="btnClear">Rimuovi la collezione da questo dispositivo</button>
    </div>
    <details id="missBox" hidden><summary id="missSum"></summary><div id="missList" class="msg"></div></details>
  </section>

  <div id="empty">Carica il file CSV per vedere le tue carte con le immagini, divise per colore, tipo ed espansione. Resta salvato su questo dispositivo.</div>

  <div id="app" hidden>
    <section class="panel stats" id="stats"></section>
    <section class="panel">
      <input id="q" type="text" placeholder="Cerca per nome o tipo (es. angelo, drago, chierico)" autocomplete="off" enterkeyhint="search">
      <div class="chips" id="colors" style="margin-top:10px"></div>
      <div class="row">
        <select id="fType" aria-label="Tipo"></select>
        <select id="fSet" aria-label="Espansione"></select>
        <select id="fRar" aria-label="Rarit&#224;"></select>
      </div>
      <div class="row">
        <select id="fSort" aria-label="Ordina per">
          <option value="name">Ordina: nome</option><option value="cmc">Ordina: costo di mana</option>
          <option value="set">Ordina: espansione</option><option value="price">Ordina: prezzo</option><option value="qty">Ordina: quantit&#224;</option>
        </select>
        <select id="fGroup" aria-label="Raggruppa per">
          <option value="none">Nessun gruppo</option><option value="color">Raggruppa: colore</option><option value="type">Raggruppa: tipo</option>
          <option value="set">Raggruppa: espansione</option><option value="rarity">Raggruppa: rarit&#224;</option>
        </select>
      </div>
      <div class="row">
        <label class="chip" id="foilChip"><input type="checkbox" id="fFoil"> Solo foil</label>
        <span class="seg"><button data-view="grid">Immagini</button><button data-view="list">Lista</button></span>
        <button class="link" id="btnReset">Azzera i filtri</button>
      </div>
      <div class="msg" id="itMsg" style="margin-top:6px"></div>
    </section>
    <div id="result"></div>
    <div class="row" style="justify-content:center"><button class="secondary" id="more" hidden>Mostra altre</button></div>
  </div>
</main>

<div id="modal" hidden><div id="mBox"><button id="mClose" aria-label="Chiudi">&times;</button><div id="mBody"></div></div></div>
<div id="toast" hidden></div>
<script src="config.js?v=2"></script>
<script src="sync.js?v=2"></script>
<script src="scry.js?v=6"></script>
<script src="collezione.js?v=8"></script>
</body>
</html>
